name: API Lint

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-lint.yml"
  push:
    branches:
      - main
      - controller
      - dev
    paths:
      - "apps/api/**"
      - ".github/workflows/api-lint.yml"
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check --config apps/api/ruff.toml apps/api/app