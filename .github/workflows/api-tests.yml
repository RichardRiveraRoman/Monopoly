name: API Tests

on:
  pull_request:
    branches:
      - main
      - controller
      - dev
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - main
      - controller
      - dev
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install fastapi[standard] pytest

      - name: Run tests
        run: pytest apps/api/tests -q